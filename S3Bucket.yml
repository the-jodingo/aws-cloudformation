AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 instance with a security group and an S3 bucket

Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair for SSH access
    Type: AWS::EC2::KeyPair::KeyName
  SSHLocation:
    Description: CIDR range allowed to SSH (use your own IP/32, not 0.0.0.0/0)
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
    ConstraintDescription: Must be a valid CIDR block.

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH access from an explicit CIDR range
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
      Tags:
        - Key: Name
          Value: ec2-s3-demo-sg

  MyInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-098e39bafa7e7303d
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: Name
          Value: ec2-s3-demo

  MyS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-${AWS::AccountId}-demo'

Outputs:
  BucketName:
    Description: Name of the created S3 bucket
    Value: !Ref MyS3Bucket
  InstanceId:
    Description: The EC2 instance ID
    Value: !Ref MyInstance
